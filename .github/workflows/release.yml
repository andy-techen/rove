name: Release

# Push a version tag to build the Mac app and publish it as a GitHub release with the
# .dmg attached:  git tag v1.1.0 && git push origin v1.1.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check
        run: |
          npm run typecheck
          npm run lint
          npm test

      # The tag sets the version, so the .dmg name and the About box match the release.
      - name: Set version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build
        run: npx electron-vite build && npx electron-builder --mac --publish never
        env:
          # No Developer ID certificate yet, so the app is ad-hoc signed and macOS asks
          # people to allow it once. With one, add CSC_LINK and CSC_KEY_PASSWORD secrets
          # (plus the notarization ones) and drop this line.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publish release
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*.dmg
          --title "Rove $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
