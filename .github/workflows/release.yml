name: Release

# Push a version tag to build the Mac app and publish it as a GitHub release with a
# .dmg for Apple silicon and one for Intel attached:  git tag v1.1.0 && git push origin v1.1.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check
        run: |
          npm run typecheck
          npm run lint
          npm test

      # The tag sets the version, so the .dmg name and the About box match the release.
      - name: Set version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # No Developer ID certificate yet, so the app is ad-hoc signed (identity "-"): a
      # valid signature, but macOS asks people to allow it once. With a certificate,
      # add CSC_LINK and CSC_KEY_PASSWORD secrets (plus notarization) and drop the flag.
      - name: Build
        run: npx electron-vite build && npx electron-builder --mac --publish never -c.mac.identity=-

      # Force-pushing a tag rebuilds its release, so an older one for it is replaced.
      - name: Publish release
        run: |
          gh release delete "$GITHUB_REF_NAME" --yes 2>/dev/null || true
          gh release create "$GITHUB_REF_NAME" dist/*.dmg \
            --title "Rove $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
